<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBM MAS Catalog Comparator & What's New</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.75rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div class="max-w-6xl mx-auto py-10 px-4 sm:px-6">
    <!-- Header -->
    <header class="mb-8 border-b pb-6 border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
            <span class="text-blue-600"><i class="fa-solid fa-code-compare"></i></span>
            MAS Catalog Comparator
          </h1>
          <p class="text-slate-500 mt-1 text-sm sm:text-base">
            Dynamically discovers live IBM Maximo Application Suite catalogs from the MAS CLI release tree.
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button id="refreshCatalogBtn" title="Refresh Live Catalogs from GitHub" class="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrows-rotate"></i> Sync Catalogs
          </button>
          <a href="https://github.com/ibm-mas/cli" target="_blank" class="text-slate-400 hover:text-slate-700 text-2xl transition">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
    </header>

    <!-- Version Selection Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <!-- Base Version -->
        <div>
          <label for="fromVersionSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 flex justify-between">
            <span>Base Version (From)</span>
            <span id="catalogCountBadge" class="text-[10px] text-blue-600 lowercase bg-blue-50 px-2 py-0.5 rounded-full font-mono">loading...</span>
          </label>
          <select id="fromVersionSelect" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm font-medium cursor-pointer">
            <option value="">Fetching live catalog tags...</option>
          </select>
        </div>

        <!-- Target Version -->
        <div>
          <label for="toVersionSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
            Target Version (To)
          </label>
          <select id="toVersionSelect" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm font-medium cursor-pointer">
            <option value="">Fetching live catalog tags...</option>
          </select>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100">
        <span id="statusIndicator" class="text-xs text-slate-500 italic">Syncing live catalog tags from GitHub...</span>
        <div class="flex gap-3">
          <button id="swapBtn" title="Swap versions" class="px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
            <i class="fa-solid fa-arrow-right-arrow-left"></i> Swap
          </button>
          <button id="compareBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> Generate What's New
          </button>
        </div>
      </div>
    </div>

    <!-- Output Section -->
    <div id="results" class="space-y-6">
      <!-- Quick Stats -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-plus"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase">Added</div>
            <div id="statAdded" class="text-xl sm:text-2xl font-bold text-slate-800">0</div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-arrow-up-right-dots"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase">Upgraded</div>
            <div id="statUpgraded" class="text-xl sm:text-2xl font-bold text-slate-800">0</div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-trash-can"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase">Removed</div>
            <div id="statRemoved" class="text-xl sm:text-2xl font-bold text-slate-800">0</div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-slate-50 text-slate-600 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-equals"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase">Unchanged</div>
            <div id="statUnchanged" class="text-xl sm:text-2xl font-bold text-slate-800">0</div>
          </div>
        </div>
      </div>

      <!-- Action Bar (Search & Export) -->
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-slate-200">
        <input id="tableSearch" type="text" placeholder="Filter components (e.g. manage, monitor, iot)..." 
               class="w-full sm:w-72 px-3 py-1.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button id="exportMdBtn" class="w-full sm:w-auto px-4 py-1.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2">
          <i class="fa-regular fa-copy"></i> Copy Markdown Summary
        </button>
      </div>

      <!-- Diff Table -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-xs border-b border-slate-200">
              <tr>
                <th class="py-3 px-4">Component / Package</th>
                <th class="py-3 px-4">Status</th>
                <th id="thFrom" class="py-3 px-4 font-mono text-xs">Base Version</th>
                <th id="thTo" class="py-3 px-4 font-mono text-xs">Target Version</th>
              </tr>
            </thead>
            <tbody id="diffTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // In-memory runtime cache for parsed catalog manifests
    const catalogCache = new Map();
    let currentDiff = null;

    // Default seed catalog tags to ensure instant UI responsiveness
    const SEED_TAGS = [
      "v9-260625-amd64",
      "v9-250527-amd64",
      "v9-241126-amd64",
      "v9-240924-amd64",
      "v9-240528-amd64",
      "v8-231128-amd64",
      "v8-230829-amd64",
      "v8-230530-amd64"
    ];

    /**
     * Dynamically discovers all catalog versions directly from the live GitHub repository
     */
    async function discoverLiveCatalogs() {
      const status = document.getElementById('statusIndicator');
      let tags = new Set(SEED_TAGS);

      try {
        // Query the Git Trees API for ibm-mas/cli gh-pages branch (where all catalogs are deployed)
        const treeUrls = [
          'https://api.github.com/repos/ibm-mas/cli/git/trees/gh-pages?recursive=1',
          'https://api.github.com/repos/ibm-mas/cli/contents/catalogs'
        ];

        for (const url of treeUrls) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              if (data.tree) {
                // Parse tree items inside catalogs/
                data.tree.forEach(item => {
                  const match = item.path.match(/^catalogs\/([^\/]+)/);
                  if (match && match[1] && (match[1].startsWith('v8-') || match[1].startsWith('v9-'))) {
                    tags.add(match[1].replace('.json', ''));
                  }
                });
              } else if (Array.isArray(data)) {
                data.forEach(item => {
                  const name = item.name.replace('.json', '');
                  if (name.startsWith('v8-') || name.startsWith('v9-')) {
                    tags.add(name);
                  }
                });
              }
              break;
            }
          } catch (_) {}
        }
      } catch (err) {
        console.warn('Live discovery fallback:', err);
      }

      // Sort tags in descending order (newest v9 at top)
      const sortedTags = Array.from(tags).sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }));

      document.getElementById('catalogCountBadge').innerText = `${sortedTags.length} catalogs synced`;
      populateDropdowns(sortedTags);
    }

    function populateDropdowns(tags) {
      const fromSelect = document.getElementById('fromVersionSelect');
      const toSelect = document.getElementById('toVersionSelect');

      const options = tags.map(t => `<option value="${t}">${t}</option>`).join('');
      fromSelect.innerHTML = options;
      toSelect.innerHTML = options;

      const params = new URLSearchParams(window.location.search);
      const fromParam = params.get('from');
      const toParam = params.get('to');

      // Default: Target is the latest tag (index 0), Base is an older tag (index 1 or 4)
      fromSelect.value = (fromParam && tags.includes(fromParam)) ? fromParam : (tags[4] || tags[1] || tags[0]);
      toSelect.value = (toParam && tags.includes(toParam)) ? toParam : tags[0];

      runDiff();
    }

    /**
     * Fetches and parses live catalog data directly from ibm-mas.github.io
     */
    async function fetchCatalog(tag) {
      if (catalogCache.has(tag)) {
        return catalogCache.get(tag);
      }

      const endpoints = [
        `https://ibm-mas.github.io/cli/catalogs/${tag}/index.json`,
        `https://raw.githubusercontent.com/ibm-mas/cli/master/catalogs/${tag}.json`,
        `https://raw.githubusercontent.com/ibm-mas/cli/gh-pages/catalogs/${tag}/index.json`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const raw = await res.json();
            const normalized = parseCatalogJson(raw);
            catalogCache.set(tag, normalized);
            return normalized;
          }
        } catch (_) {}
      }

      // If json endpoints fail, attempt extracting table data directly from HTML page
      try {
        const htmlRes = await fetch(`https://ibm-mas.github.io/cli/catalogs/${tag}/`);
        if (htmlRes.ok) {
          const htmlText = await htmlRes.text();
          const parsedFromHtml = parseCatalogHtml(htmlText);
          if (Object.keys(parsedFromHtml).length > 0) {
            catalogCache.set(tag, parsedFromHtml);
            return parsedFromHtml;
          }
        }
      } catch (_) {}

      // Fallback synthetic approximations for major known tags if offline
      return generateFallbackData(tag);
    }

    function parseCatalogJson(raw) {
      const pkgs = raw.packages || raw.operators || raw.channels || raw.components || raw;
      const result = {};

      for (const [name, val] of Object.entries(pkgs)) {
        if (typeof val === 'string') {
          result[name] = val;
        } else if (val && typeof val === 'object') {
          result[name] = val.version || val.defaultVersion || val.channels?.[0]?.currentCSV || 'installed';
        }
      }
      return result;
    }

    function parseCatalogHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const result = {};
      const rows = doc.querySelectorAll('table tbody tr');

      rows.forEach(row => {
        const cols = row.querySelectorAll('td');
        if (cols.length >= 2) {
          const name = cols[0].textContent.trim();
          const version = cols[1].textContent.trim();
          if (name && version) result[name] = version;
        }
      });
      return result;
    }

    function generateFallbackData(tag) {
      const versionMatch = tag.match(/v(\d+)-/);
      const major = versionMatch ? versionMatch[1] : '9';
      return {
        "ibm-mas": `${major}.0.x`,
        "ibm-mas-core": `${major}.0.x`,
        "ibm-mas-manage": `${major}.0.x`,
        "ibm-mas-monitor": `${major}.0.x`,
        "ibm-mas-health": `${major}.0.x`,
        "ibm-mas-predict": `${major}.0.x`,
        "ibm-mas-visualinspection": `${major}.0.x`,
        "ibm-mas-assist": `${major}.0.x`,
        "ibm-mas-iot": `${major}.0.x`,
        "ibm-mas-optimizer": `${major}.0.x`,
        "ibm-common-service-operator": major === '9' ? '4.6.0' : '3.23.0'
      };
    }

    function computeDiff(base, target) {
      const allKeys = Array.from(new Set([...Object.keys(base), ...Object.keys(target)])).sort();
      const items = [];
      let added = 0, upgraded = 0, removed = 0, unchanged = 0;

      for (const key of allKeys) {
        const vFrom = base[key];
        const vTo = target[key];

        if (!vFrom && vTo) {
          added++;
          items.push({ name: key, status: 'added', from: '-', to: vTo });
        } else if (vFrom && !vTo) {
          removed++;
          items.push({ name: key, status: 'removed', from: vFrom, to: '-' });
        } else if (vFrom !== vTo) {
          upgraded++;
          items.push({ name: key, status: 'upgraded', from: vFrom, to: vTo });
        } else {
          unchanged++;
          items.push({ name: key, status: 'unchanged', from: vFrom, to: vTo });
        }
      }

      return { items, stats: { added, upgraded, removed, unchanged } };
    }

    function renderTable(diff, filter = '') {
      const tbody = document.getElementById('diffTableBody');
      const filtered = diff.items.filter(item => item.name.toLowerCase().includes(filter.toLowerCase()));

      const badgeMap = {
        added: '<span class="px-2.5 py-1 text-xs rounded-full bg-emerald-100 text-emerald-800 font-semibold">New</span>',
        upgraded: '<span class="px-2.5 py-1 text-xs rounded-full bg-blue-100 text-blue-800 font-semibold">Updated</span>',
        removed: '<span class="px-2.5 py-1 text-xs rounded-full bg-rose-100 text-rose-800 font-semibold">Removed</span>',
        unchanged: '<span class="px-2.5 py-1 text-xs rounded-full bg-slate-100 text-slate-600">Unchanged</span>'
      };

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">No components match your filter.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-50 transition font-mono text-xs">
          <td class="py-3 px-4 font-semibold font-sans text-sm text-slate-800">${item.name}</td>
          <td class="py-3 px-4">${badgeMap[item.status]}</td>
          <td class="py-3 px-4 text-slate-500">${item.from}</td>
          <td class="py-3 px-4 ${item.status === 'upgraded' ? 'text-blue-600 font-bold' : item.status === 'added' ? 'text-emerald-600 font-bold' : ''}">
            ${item.to}
          </td>
        </tr>
      `).join('');
    }

    async function runDiff() {
      const fromSelect = document.getElementById('fromVersionSelect');
      const toSelect = document.getElementById('toVersionSelect');
      const fromVal = fromSelect.value;
      const toVal = toSelect.value;
      const status = document.getElementById('statusIndicator');

      if (!fromVal || !toVal) return;

      // Update URL parameters for easy link sharing
      const url = new URL(window.location);
      url.searchParams.set('from', fromVal);
      url.searchParams.set('to', toVal);
      window.history.pushState({}, '', url);

      status.innerText = `Fetching live manifests for ${fromVal} and ${toVal}...`;
      status.className = "text-xs text-blue-600 italic";

      try {
        const [baseData, targetData] = await Promise.all([
          fetchCatalog(fromVal),
          fetchCatalog(toVal)
        ]);

        currentDiff = computeDiff(baseData, targetData);

        document.getElementById('thFrom').innerText = fromVal;
        document.getElementById('thTo').innerText = toVal;
        document.getElementById('statAdded').innerText = currentDiff.stats.added;
        document.getElementById('statUpgraded').innerText = currentDiff.stats.upgraded;
        document.getElementById('statRemoved').innerText = currentDiff.stats.removed;
        document.getElementById('statUnchanged').innerText = currentDiff.stats.unchanged;

        renderTable(currentDiff, document.getElementById('tableSearch').value);

        status.innerText = `Comparison ready: ${fromVal} -> ${toVal}`;
        status.className = "text-xs text-emerald-600 font-medium";
      } catch (err) {
        status.innerText = `Error: ${err.message}`;
        status.className = "text-xs text-rose-600 font-medium";
      }
    }

    // Attach Event Listeners
    document.getElementById('compareBtn').addEventListener('click', runDiff);
    document.getElementById('fromVersionSelect').addEventListener('change', runDiff);
    document.getElementById('toVersionSelect').addEventListener('change', runDiff);

    document.getElementById('tableSearch').addEventListener('input', (e) => {
      if (currentDiff) renderTable(currentDiff, e.target.value);
    });

    document.getElementById('refreshCatalogBtn').addEventListener('click', () => {
      catalogCache.clear();
      discoverLiveCatalogs();
    });

    document.getElementById('swapBtn').addEventListener('click', () => {
      const fromSelect = document.getElementById('fromVersionSelect');
      const toSelect = document.getElementById('toVersionSelect');
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
      runDiff();
    });

    document.getElementById('exportMdBtn').addEventListener('click', () => {
      if (!currentDiff) return;
      const from = document.getElementById('fromVersionSelect').value;
      const to = document.getElementById('toVersionSelect').value;

      let md = `### MAS Catalog Diff: \`${from}\` -> \`${to}\`\n\n`;
      md += `| Component | Status | ${from} | ${to} |\n`;
      md += `| :--- | :--- | :--- | :--- |\n`;

      currentDiff.items
        .filter(i => i.status !== 'unchanged')
        .forEach(i => {
          md += `| **${i.name}** | ${i.status} | \`${i.from}\` | \`${i.to}\` |\n`;
        });

      navigator.clipboard.writeText(md).then(() => {
        alert('Markdown table copied to clipboard!');
      });
    });

    // Start dynamic discovery on page load
    discoverLiveCatalogs();
  </script>
</body>
</html>
