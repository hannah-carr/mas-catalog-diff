<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBM MAS - What's New Comparator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.75rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    .prose a {
      color: #2563eb;
      text-decoration: underline;
    }
    .prose a:hover {
      color: #1d4ed8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div class="max-w-5xl mx-auto py-10 px-4 sm:px-6">
    <!-- Header -->
    <header class="mb-8 border-b pb-6 border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
            <span class="text-blue-600"><i class="fa-solid fa-newspaper"></i></span>
            MAS "What's New" Aggregator
          </h1>
          <p class="text-slate-600 mt-1 text-sm sm:text-base">
            Compare any two MAS catalog versions and extract all "What's New" articles, release notes, and documentation updates published between them.
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button id="refreshBtn" title="Sync live catalogs" class="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrows-rotate"></i> Sync
          </button>
          <a href="https://github.com/ibm-mas/cli" target="_blank" class="text-slate-400 hover:text-slate-700 text-2xl transition">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
    </header>

    <!-- Version Selection Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <!-- Base Version -->
        <div>
          <label for="fromVersionSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 flex justify-between">
            <span>Starting Version (From)</span>
            <span id="catalogCountBadge" class="text-[10px] text-blue-600 lowercase bg-blue-50 px-2 py-0.5 rounded-full font-mono">syncing...</span>
          </label>
          <select id="fromVersionSelect" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm font-medium cursor-pointer">
            <option value="">Loading catalogs...</option>
          </select>
        </div>

        <!-- Target Version -->
        <div>
          <label for="toVersionSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
            Target Version (To)
          </label>
          <select id="toVersionSelect" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm font-medium cursor-pointer">
            <option value="">Loading catalogs...</option>
          </select>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100">
        <span id="statusIndicator" class="text-xs text-slate-500 italic">Select starting and target versions to pull What's New highlights.</span>
        <div class="flex gap-3">
          <button id="swapBtn" title="Swap versions" class="px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
            <i class="fa-solid fa-arrow-right-arrow-left"></i> Swap
          </button>
          <button id="compareBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
            <i class="fa-solid fa-sparkles"></i> Extract What's New
          </button>
        </div>
      </div>
    </div>

    <!-- Output Section -->
    <div id="results" class="space-y-6">
      <!-- Summary Bar -->
      <div id="summaryBar" class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hidden">
        <div>
          <h2 id="summaryTitle" class="text-base font-bold text-blue-900">What's New Summary</h2>
          <p id="summarySubtitle" class="text-xs text-blue-700 mt-0.5">Aggregated changes across releases</p>
        </div>
        <button id="copyAllMdBtn" class="px-3.5 py-1.5 bg-white border border-blue-300 hover:bg-blue-100 text-blue-800 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-regular fa-copy"></i> Copy Markdown Summary
        </button>
      </div>

      <!-- Container for aggregated What's New cards -->
      <div id="whatsNewContainer" class="space-y-6"></div>
    </div>
  </div>

  <script>
    const catalogCache = new Map();
    let allDiscoveredTags = [];

    // Built-in initial list to guarantee immediate rendering
    const SEED_TAGS = [
      "v9-260918-amd64",
      "v9-260625-amd64",
      "v9-250527-amd64",
      "v9-241126-amd64",
      "v9-240924-amd64",
      "v9-240528-amd64",
      "v8-231128-amd64",
      "v8-230829-amd64",
      "v8-230530-amd64"
    ];

    /**
     * Discovers all available catalogs dynamically from GitHub Pages tree
     */
    async function discoverCatalogs() {
      const tags = new Set(SEED_TAGS);

      try {
        const res = await fetch('https://api.github.com/repos/ibm-mas/cli/git/trees/gh-pages?recursive=1');
        if (res.ok) {
          const data = await res.json();
          if (data.tree) {
            data.tree.forEach(item => {
              const match = item.path.match(/^catalogs\/([^\/]+)/);
              if (match && match[1] && (match[1].startsWith('v8-') || match[1].startsWith('v9-'))) {
                tags.add(match[1].replace('.json', ''));
              }
            });
          }
        }
      } catch (err) {
        console.warn('Discovery fallback used');
      }

      allDiscoveredTags = Array.from(tags).sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }));
      document.getElementById('catalogCountBadge').innerText = `${allDiscoveredTags.length} catalogs synced`;

      populateDropdowns(allDiscoveredTags);
    }

    function populateDropdowns(tags) {
      const fromSelect = document.getElementById('fromVersionSelect');
      const toSelect = document.getElementById('toVersionSelect');

      const options = tags.map(t => `<option value="${t}">${t}</option>`).join('');
      fromSelect.innerHTML = options;
      toSelect.innerHTML = options;

      const params = new URLSearchParams(window.location.search);
      const fromParam = params.get('from');
      const toParam = params.get('to');

      // Default: Target is latest (index 0), Base is an older release (index 3 or 4)
      fromSelect.value = (fromParam && tags.includes(fromParam)) ? fromParam : (tags[3] || tags[1]);
      toSelect.value = (toParam && tags.includes(toParam)) ? toParam : tags[0];

      extractWhatsNew();
    }

    /**
     * Fetches and parses the live HTML catalog page to extract the "What's New" content and links
     */
    async function fetchWhatsNewForCatalog(tag) {
      if (catalogCache.has(tag)) {
        return catalogCache.get(tag);
      }

      const catalogUrl = `https://ibm-mas.github.io/cli/catalogs/${tag}/`;

      try {
        const res = await fetch(catalogUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const htmlText = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // Look for What's New section headers or content
        let whatsNewLinks = [];
        let whatsNewContent = [];

        // 1. Extract all links under any heading containing "What's New" or the main content section
        const headings = Array.from(doc.querySelectorAll('h1, h2, h3, h4'));
        const whatsNewHeading = headings.find(h => /what'?s new/i.test(h.textContent));

        if (whatsNewHeading) {
          let curr = whatsNewHeading.nextElementSibling;
          while (curr && !['H1', 'H2'].includes(curr.tagName)) {
            // Collect links
            const links = curr.querySelectorAll('a');
            links.forEach(a => {
              const href = a.getAttribute('href');
              const text = a.textContent.trim();
              if (href && text) {
                // Resolve relative URLs to full IBM documentation links
                const fullUrl = href.startsWith('http') ? href : new URL(href, catalogUrl).href;
                whatsNewLinks.push({ title: text, url: fullUrl });
              }
            });

            // Collect text bullet points / paragraphs
            if (curr.tagName === 'UL' || curr.tagName === 'OL') {
              curr.querySelectorAll('li').forEach(li => {
                whatsNewContent.push(li.innerHTML.trim());
              });
            } else if (curr.tagName === 'P') {
              whatsNewContent.push(curr.innerHTML.trim());
            }

            curr = curr.nextElementSibling;
          }
        }

        // 2. If no explicit heading found, extract documentation links that mention "what's new", "release notes", or IBM doc sections
        if (whatsNewLinks.length === 0) {
          const allLinks = doc.querySelectorAll('a');
          allLinks.forEach(a => {
            const href = a.getAttribute('href') || '';
            const text = a.textContent.trim();
            if (/what'?s new|release notes|whats_new|announcement/i.test(text + ' ' + href)) {
              const fullUrl = href.startsWith('http') ? href : new URL(href, catalogUrl).href;
              whatsNewLinks.push({ title: text || 'What\'s New Announcement', url: fullUrl });
            }
          });
        }

        // Deduplicate links by URL
        const uniqueLinks = [];
        const seen = new Set();
        for (const item of whatsNewLinks) {
          if (!seen.has(item.url)) {
            seen.add(item.url);
            uniqueLinks.push(item);
          }
        }

        const result = {
          tag,
          catalogUrl,
          links: uniqueLinks,
          content: whatsNewContent
        };

        catalogCache.set(tag, result);
        return result;
      } catch (err) {
        // Fallback structure pointing to catalog page
        return {
          tag,
          catalogUrl,
          links: [
            {
              title: `View ${tag} Official Catalog & Release Notes`,
              url: catalogUrl
            }
          ],
          content: [`Detailed release notes available on the official catalog page.`]
        };
      }
    }

    /**
     * Determines which catalogs fall in the selected range between From and To
     */
    function getCatalogsInRange(fromTag, toTag) {
      const idxFrom = allDiscoveredTags.indexOf(fromTag);
      const idxTo = allDiscoveredTags.indexOf(toTag);

      if (idxFrom === -1 || idxTo === -1) {
        return [toTag];
      }

      const start = Math.min(idxFrom, idxTo);
      const end = Math.max(idxFrom, idxTo);

      // Return slice from latest down to the selected base
      return allDiscoveredTags.slice(start, end + 1);
    }

    async function extractWhatsNew() {
      const fromVal = document.getElementById('fromVersionSelect').value;
      const toVal = document.getElementById('toVersionSelect').value;
      const status = document.getElementById('statusIndicator');
      const container = document.getElementById('whatsNewContainer');
      const summaryBar = document.getElementById('summaryBar');

      if (!fromVal || !toVal) return;

      const url = new URL(window.location);
      url.searchParams.set('from', fromVal);
      url.searchParams.set('to', toVal);
      window.history.pushState({}, '', url);

      status.innerText = `Extracting What's New between ${fromVal} and ${toVal}...`;
      status.className = "text-xs text-blue-600 italic";

      container.innerHTML = `
        <div class="p-8 text-center bg-white rounded-2xl border border-slate-200">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600 mb-3"></i>
          <p class="text-sm font-medium text-slate-700">Fetching live release notes & documentation links from MAS catalog pages...</p>
        </div>
      `;

      try {
        const targetCatalogs = getCatalogsInRange(fromVal, toVal);
        const results = await Promise.all(targetCatalogs.map(t => fetchWhatsNewForCatalog(t)));

        summaryBar.classList.remove('hidden');
        document.getElementById('summaryTitle').innerText = `What's New: ${fromVal} ➔ ${toVal}`;
        document.getElementById('summarySubtitle').innerText = `Displaying release notes across ${results.length} catalog release(s)`;

        container.innerHTML = results.map(item => `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition hover:shadow-md">
            <!-- Catalog Header -->
            <div class="bg-slate-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 text-xs rounded-full bg-blue-500/20 text-blue-300 font-mono font-bold border border-blue-400/30">
                  ${item.tag}
                </span>
                <span class="text-sm font-semibold text-slate-200">Release Notes & Updates</span>
              </div>
              <a href="${item.catalogUrl}" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                <span>Open Catalog Page</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>

            <!-- Content Area -->
            <div class="p-6 space-y-6">
              <!-- Links Section -->
              ${item.links.length > 0 ? `
                <div>
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-link text-blue-600"></i> What's New Articles & Documentation
                  </h4>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${item.links.map(l => `
                      <a href="${l.url}" target="_blank" class="p-3 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition flex items-start justify-between group">
                        <span class="text-sm font-medium text-slate-800 group-hover:text-blue-600 transition pr-2">
                          ${l.title}
                        </span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400 group-hover:text-blue-600 mt-1 flex-shrink-0 transition"></i>
                      </a>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Extracted Highlights / Text -->
              ${item.content.length > 0 ? `
                <div>
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-emerald-600"></i> Highlights & Changes
                  </h4>
                  <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 prose text-sm text-slate-700 space-y-2">
                    ${item.content.map(c => `<div>${c}</div>`).join('')}
                  </div>
                </div>
              ` : `
                <div class="text-xs text-slate-400 italic">
                  See linked documentation above for detailed functional updates in this release.
                </div>
              `}
            </div>
          </div>
        `).join('');

        status.innerText = `Extracted What's New for ${targetCatalogs.length} catalog release(s)`;
        status.className = "text-xs text-emerald-600 font-medium";
      } catch (err) {
        container.innerHTML = `<div class="p-6 text-rose-600 bg-rose-50 border border-rose-200 rounded-xl text-sm">Failed to extract What's New: ${err.message}</div>`;
        status.innerText = `Error: ${err.message}`;
        status.className = "text-xs text-rose-600 font-medium";
      }
    }

    // Attach Event Handlers
    document.getElementById('compareBtn').addEventListener('click', extractWhatsNew);
    document.getElementById('fromVersionSelect').addEventListener('change', extractWhatsNew);
    document.getElementById('toVersionSelect').addEventListener('change', extractWhatsNew);

    document.getElementById('refreshBtn').addEventListener('click', () => {
      catalogCache.clear();
      discoverCatalogs();
    });

    document.getElementById('swapBtn').addEventListener('click', () => {
      const fromSelect = document.getElementById('fromVersionSelect');
      const toSelect = document.getElementById('toVersionSelect');
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
      extractWhatsNew();
    });

    document.getElementById('copyAllMdBtn').addEventListener('click', () => {
      const fromVal = document.getElementById('fromVersionSelect').value;
      const toVal = document.getElementById('toVersionSelect').value;
      let md = `## MAS What's New Summary: ${fromVal} -> ${toVal}\n\n`;

      const targetCatalogs = getCatalogsInRange(fromVal, toVal);
      targetCatalogs.forEach(t => {
        const item = catalogCache.get(t);
        if (item) {
          md += `### Catalog Release: \`${t}\`\n`;
          md += `- **Catalog Page**: [View Catalog](${item.catalogUrl})\n`;
          if (item.links.length) {
            md += `\n**What's New Documentation Links:**\n`;
            item.links.forEach(l => {
              md += `- [${l.title}](${l.url})\n`;
            });
          }
          md += `\n---\n\n`;
        }
      });

      navigator.clipboard.writeText(md).then(() => {
        alert('What\'s New Markdown summary copied to clipboard!');
      });
    });

    discoverCatalogs();
  </script>
</body>
</html>
